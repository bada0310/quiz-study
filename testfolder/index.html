<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 퀴즈 쇼</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="screen-author-list">
        <h1>🚀 퀴즈 방에 오신 것을 환영합니다!</h1>
        <h2 style="margin-bottom: 40px;">문제를 풀 출제자를 선택하세요</h2>
        <div id="author-list"></div>
        <hr style="border: 0; border-top: 1px dashed #ccc; width: 80%; margin: 40px auto;">
        <button class="submit-btn" onclick="showGlobalResultBoard()" style="background-color: #009688; font-size: 22px; width: 350px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">🏆 전체 종합 랭킹 보드 보기</button>
    </div>

    <div id="screen-role-selection" style="display: none;">
        <h1 id="selected-room-title"></h1>
        <h2>당신의 역할을 선택해주세요</h2>
        <div class="role-btn-container">
            <button class="role-btn questioner" id="btn-questioner">👑 출제자 (방장)</button>
            <button class="role-btn respondent" id="btn-respondent">🙋 응시자 (참가자)</button>
        </div>
        <button class="back-btn" onclick="goBack()" style="margin-top: 50px;">🔙 뒤로 가기</button>
    </div>

    <div id="screen-result-board" style="display: none;">
        <h1 id="result-board-title" style="margin-bottom: 40px; color: #333;">🏆 스터디 전체 누적 랭킹 보드</h1>
        <div style="width: 80%; max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <canvas id="scoreChart"></canvas>
        </div>
        <button class="back-btn" onclick="goBackToMainFromBoard()" style="margin-top: 40px;">🔙 메인 화면으로 돌아가기</button>
    </div>

    <div id="screen-quiz-room" style="display: none;">
        <h1 id="quiz-room-header"></h1>
        <div id="system-messages" style="color: #888; margin-bottom: 20px;"></div>
        
        <div id="quiz-contentArea">
            <h2 id="question-text">문제가 곧 시작됩니다...</h2>
            
            <div id="questioner-ui" style="display: none; margin-top: 40px;">
                <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
                    <button class="submit-btn" onclick="prevQuestion()" style="background-color: #795548;">⬅️ 이전 문제</button>
                    <button class="submit-btn" onclick="startQuestion()" style="background-color: #9C27B0;">🚀 다음 문제</button>
                </div>
                
                <button id="btn-check-answer" class="submit-btn" onclick="showAnswer()" style="background-color: #FF5722;">
                    🔓 정답 확인 (제출 대기중...)
                </button>
                
                <div id="monitoring-panel" style="margin-top: 30px; padding: 20px; background-color: #f8f9fa; border-radius: 10px; border: 1px solid #ddd; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto;">
                    <h3 style="margin-top: 0; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px;">📊 실시간 응답 모니터링</h3>
                    <ul id="monitoring-list" style="font-size: 18px; line-height: 1.8; list-style-type: none; padding-left: 0;">
                        <li style="color: #888;">아직 제출된 응답이 없습니다.</li>
                    </ul>
                </div>

                <button class="back-btn" onclick="goToMain()" style="margin-top: 50px;">🏠 메인 화면으로 (방 종료)</button>
            </div>

            <div id="respondent-ui" style="display: none;">
                <div id="ui-ox" style="display: none;">
                    <div class="ox-btn-container">
                        <button class="ox-btn btn-o" id="btn-o" onclick="sendAnswer('O')">O</button>
                        <button class="ox-btn btn-x" id="btn-x" onclick="sendAnswer('X')">X</button>
                    </div>
                    <div class="gauge-container">
                        <div id="gauge-o" class="gauge-fill-o" style="width: 50%;">O (0명)</div>
                        <div id="gauge-x" class="gauge-fill-x" style="width: 50%;">X (0명)</div>
                    </div>
                </div>

                <div id="ui-short" style="display: none;">
                    <input type="text" id="short-answer-input" class="answer-input" placeholder="정답을 입력하세요">
                    <button class="submit-btn" onclick="sendShortAnswer()">제출하기</button>
                    <h3 style="margin-top: 40px;">실시간 제출 답안</h3>
                    <div id="submitted-answers-container" class="answers-container"></div>
                </div>
                
                <button class="back-btn" onclick="goToMain()" style="margin-top: 50px;">🚪 방 나가기 (메인으로)</button>
            </div>

            <div id="ui-result" style="display: none; margin-top: 30px; padding: 30px; background-color: #e8f5e9; border-radius: 15px; border: 2px solid #4CAF50;">
                <h2 id="result-answer-text" style="color: #2E7D32; font-size: 32px; margin-bottom: 20px;">정답: </h2>
                <hr style="border-top: 1px dashed #4CAF50;">
                <div id="result-explanation-text" style="margin-top: 20px; font-size: 18px; line-height: 1.6; text-align: left; white-space: pre-wrap;">
                    풀이 내용
                </div>
            </div>

        </div>
    </div>

    <script>
        let ws; 
        let globalData; 
        let currentRoomName = "";      
        let currentQuestionIndex = 0;  
        let currentQuestionData = {};  
        
        let myUserId = "출제자"; 
        let myCurrentVote = null; 
        let scoreChartInstance = null; 

        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                globalData = data;
                const authorList = document.getElementById('author-list');
                for (const author in data) {
                    const btn = document.createElement('button');
                    btn.className = 'author-btn';
                    btn.innerText = author + '의 문제 풀기';
                    btn.onclick = () => showRoleSelection(author);
                    authorList.appendChild(btn);
                }
            });

        function showRoleSelection(authorName) {
            document.getElementById('screen-author-list').style.display = 'none';
            document.getElementById('screen-role-selection').style.display = 'block';
            document.getElementById('selected-room-title').innerText = `[${authorName}] 님의 퀴즈 방`;
            
            document.getElementById('btn-questioner').onclick = () => enterQuizRoom(authorName, '출제자');
            document.getElementById('btn-respondent').onclick = () => enterQuizRoom(authorName, '응시자');
        }

        function goBack() {
            document.getElementById('screen-role-selection').style.display = 'none';
            document.getElementById('screen-author-list').style.display = 'block';
        }

        function goToMain() {
            if(confirm("메인 화면으로 돌아가시겠습니까?")) {
                window.location.reload(); 
            }
        }

        function showGlobalResultBoard() {
            document.getElementById('screen-author-list').style.display = 'none';
            document.getElementById('screen-result-board').style.display = 'block';

            fetch('/api/scores')
                .then(res => res.json())
                .then(allScores => {
                    renderStackedChart(allScores);
                });
        }

        function goBackToMainFromBoard() {
            document.getElementById('screen-result-board').style.display = 'none';
            document.getElementById('screen-author-list').style.display = 'block';
        }

        function renderStackedChart(allScores) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            if (scoreChartInstance) scoreChartInstance.destroy();

            const usersSet = new Set();
            for (const room in allScores) {
                for (const user in allScores[room]) {
                    usersSet.add(user);
                }
            }
            const users = Array.from(usersSet);

            if (users.length === 0) {
                scoreChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: ['아직 누적된 데이터가 없습니다'], datasets: [{ data: [0] }] },
                    options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                });
                return;
            }

            const datasets = [];
            const colors = ['#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#E91E63', '#00BCD4'];
            let colorIndex = 0;

            for (const room in allScores) {
                const data = users.map(user => allScores[room][user] || 0);
                datasets.push({
                    label: `${room}의 퀴즈`,
                    data: data,
                    backgroundColor: colors[colorIndex % colors.length],
                    borderRadius: 4,
                });
                colorIndex++;
            }

            scoreChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: users, datasets: datasets },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } }
                    },
                    plugins: { legend: { display: true } }
                }
            });
        }

        function enterQuizRoom(roomName, role) {
            if (role === '응시자') {
                const nickname = prompt("퀴즈에 사용할 본인의 닉네임을 입력해주세요 (예: 임건애):");
                if (!nickname) return; 
                myUserId = nickname;
            }

            currentRoomName = roomName; 
            currentQuestionIndex = 0;   
            
            document.getElementById('screen-role-selection').style.display = 'none';
            document.getElementById('screen-quiz-room').style.display = 'block';
            document.getElementById('quiz-room-header').innerText = `[${roomName}] 퀴즈 방 - ${role}`;

            if (role === '출제자') {
                document.getElementById('questioner-ui').style.display = 'block';
                document.getElementById('respondent-ui').style.display = 'none';
            } else if (role === '응시자') {
                document.getElementById('questioner-ui').style.display = 'none';
                document.getElementById('respondent-ui').style.display = 'block';
            }

            const wsUrl = `ws://${window.location.host}/ws/${encodeURIComponent(roomName)}/${encodeURIComponent(role)}`;
            ws = new WebSocket(wsUrl);

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'system') {
                    document.getElementById('system-messages').innerText = data.msg;
                }
                else if (data.type === 'start_question') {
                    currentQuestionData = data; 
                    myCurrentVote = null; 
                    document.getElementById('question-text').innerText = data.question_text;
                    
                    document.getElementById('ui-result').style.display = 'none';
                    
                    document.getElementById('btn-o').style.opacity = '1';
                    document.getElementById('btn-x').style.opacity = '1';

                    if (role === '응시자') {
                        const ans = data.answer.toUpperCase();
                        if (ans === 'O' || ans === 'X') {
                            document.getElementById('ui-ox').style.display = 'block';
                            document.getElementById('ui-short').style.display = 'none';
                        } else {
                            document.getElementById('ui-ox').style.display = 'none';
                            document.getElementById('ui-short').style.display = 'block';
                        }
                    }
                    
                    document.getElementById('gauge-o').style.width = '50%';
                    document.getElementById('gauge-o').innerText = 'O (0명)';
                    document.getElementById('gauge-x').style.width = '50%';
                    document.getElementById('gauge-x').innerText = 'X (0명)';
                    document.getElementById('submitted-answers-container').innerHTML = '';
                    
                    if (role === '출제자') {
                        const checkBtn = document.getElementById('btn-check-answer');
                        checkBtn.innerText = `🔓 정답 확인 (제출 대기중...)`;
                        document.getElementById('monitoring-list').innerHTML = '<li style="color: #888;">아직 제출된 응답이 없습니다.</li>';
                    }
                }
                else if (data.type === 'update_stats') {
                    const state = data.state;
                    const totalOx = state.o_count + state.x_count;
                    
                    if (totalOx > 0) {
                        const oPercent = Math.round((state.o_count / totalOx) * 100);
                        const xPercent = 100 - oPercent;
                        document.getElementById('gauge-o').style.width = oPercent + '%';
                        document.getElementById('gauge-o').innerText = `O (${state.o_count}명)`;
                        document.getElementById('gauge-x').style.width = xPercent + '%';
                        document.getElementById('gauge-x').innerText = `X (${state.x_count}명)`;
                    } else {
                        document.getElementById('gauge-o').style.width = '50%';
                        document.getElementById('gauge-o').innerText = 'O (0명)';
                        document.getElementById('gauge-x').style.width = '50%';
                        document.getElementById('gauge-x').innerText = 'X (0명)';
                    }
                    
                    const container = document.getElementById('submitted-answers-container');
                    container.innerHTML = ''; 
                    
                    // 🔥 [수정됨] 글자 길이와 순서를 바탕으로 한 '고정된 랜덤(Stable Random)' 마스킹 로직
                    state.short_answers.forEach((ans, idx) => {
                        const block = document.createElement('div');
                        block.className = 'answer-block';
                        
                        let displayAns = ans;
                        
                        if (role === '응시자') {
                            // 공백을 제외한 실제 글자의 위치(인덱스)들만 모읍니다.
                            let validIndices = [];
                            for (let i = 0; i < ans.length; i++) {
                                if (ans[i] !== ' ') validIndices.push(i);
                            }

                            // 단어 길이에 따라 힌트로 보여줄 글자 수 결정
                            let revealCount = 2;
                            if (validIndices.length >= 5) revealCount = 3; 
                            if (validIndices.length <= 2) revealCount = 1;

                            // 위치가 깜빡이지 않도록 (제출 순서 + 단어 자체)를 조합해 고유 시드(Seed) 생성
                            let seed = idx * 13; 
                            for (let i = 0; i < ans.length; i++) {
                                seed += ans.charCodeAt(i);
                            }

                            // 고정된 시드를 이용해 위치를 랜덤하게 섞기
                            let shuffled = [...validIndices];
                            for (let i = shuffled.length - 1; i > 0; i--) {
                                let r = Math.abs(Math.sin(seed++)) * 10000;
                                let j = Math.floor((r - Math.floor(r)) * (i + 1));
                                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                            }

                            // 섞인 위치 중에서 앞의 2~3개만 '보여줄 위치'로 선정
                            let revealedSet = new Set(shuffled.slice(0, revealCount));

                            // 마스킹 처리 (선정된 위치만 글자 보임, 나머지는 동그라미)
                            let masked = "";
                            for (let i = 0; i < ans.length; i++) {
                                if (ans[i] === ' ') masked += ' ';       // 띄어쓰기 유지
                                else if (revealedSet.has(i)) masked += ans[i]; // 당첨된 위치는 글자 표시
                                else masked += '○';                     // 나머지는 가림
                            }
                            displayAns = masked;
                        }

                        block.innerText = displayAns;
                        container.appendChild(block);
                    });
                    
                    if (role === '출제자') {
                        const checkBtn = document.getElementById('btn-check-answer');
                        
                        if (state.total_answers > 0) {
                            checkBtn.innerText = `🔓 정답 확인 (현재 ${state.total_answers}명 제출 완료)`;
                        } else {
                            checkBtn.innerText = `🔓 정답 확인 (제출 대기중...)`;
                        }

                        const monitorList = document.getElementById('monitoring-list');
                        monitorList.innerHTML = ''; 
                        
                        const detailData = data.question_type === 'ox' ? state.votes_detail : state.short_answers_detail;
                        const users = Object.keys(detailData);
                        
                        if (users.length === 0) {
                            monitorList.innerHTML = '<li style="color: #888;">아직 제출된 응답이 없습니다.</li>';
                        } else {
                            if (data.question_type === 'short') {
                                monitorList.innerHTML = '<li style="color: #FF5722; font-size: 15px; font-weight: bold; margin-bottom: 10px;">✅ 정답으로 인정할 사람을 체크한 뒤 [정답 확인]을 누르면 점수가 올라갑니다!</li>';
                            }

                            users.forEach(user => {
                                const li = document.createElement('li');
                                const answerText = detailData[user];
                                
                                let color = '#2196F3'; 
                                if (answerText === 'O') color = '#4CAF50';
                                else if (answerText === 'X') color = '#F44336';
                                
                                if (data.question_type === 'short') {
                                    const isAutoCorrect = (answerText.trim().toLowerCase() === currentQuestionData.answer.trim().toLowerCase());
                                    
                                    li.innerHTML = `
                                        <label style="cursor: pointer; display: flex; align-items: center;">
                                            <input type="checkbox" class="correct-checkbox" value="${user}" ${isAutoCorrect ? 'checked' : ''} style="transform: scale(1.5); margin-right: 15px;">
                                            <span>👤 <strong>${user}</strong> 님 : <span style="color: ${color}; font-weight: bold;">${answerText}</span></span>
                                        </label>
                                    `;
                                } else {
                                    li.innerHTML = `👤 <strong>${user}</strong> 님 : <span style="color: ${color}; font-weight: bold;">${answerText}</span>`;
                                }
                                monitorList.appendChild(li);
                            });
                        }
                    }
                }
                else if (data.type === 'show_answer') {
                    if (role === '응시자') {
                        document.getElementById('ui-ox').style.display = 'none';
                        document.getElementById('ui-short').style.display = 'none';
                    }
                    
                    document.getElementById('ui-result').style.display = 'block';
                    document.getElementById('result-answer-text').innerText = `정답: ${currentQuestionData.answer}`;
                    document.getElementById('result-explanation-text').innerText = currentQuestionData.explanation || "풀이가 없습니다.";
                }
            };
        }

        function sendAnswer(choice) {
            if (myCurrentVote === choice) {
                myCurrentVote = null;
                document.getElementById('btn-o').style.opacity = '1';
                document.getElementById('btn-x').style.opacity = '1';
                ws.send(JSON.stringify({ type: 'submit_answer', question_type: 'ox', answer: null, user_id: myUserId }));
            } else {
                myCurrentVote = choice;
                if(choice === 'O') {
                    document.getElementById('btn-o').style.opacity = '1';
                    document.getElementById('btn-x').style.opacity = '0.3'; 
                } else {
                    document.getElementById('btn-o').style.opacity = '0.3';
                    document.getElementById('btn-x').style.opacity = '1';
                }
                ws.send(JSON.stringify({ type: 'submit_answer', question_type: 'ox', answer: choice, user_id: myUserId }));
            }
        }

        function sendShortAnswer() {
            const input = document.getElementById('short-answer-input');
            const text = input.value.trim();
            if (text === '') return alert("답안을 입력해주세요!");
            ws.send(JSON.stringify({ type: 'submit_answer', question_type: 'short', answer: text, user_id: myUserId }));
            input.value = ''; 
        }

        function startQuestion() {
            const myQuestions = globalData[currentRoomName];
            if (!myQuestions || currentQuestionIndex >= myQuestions.length) {
                alert("🎉 준비된 모든 문제가 끝났습니다! 메인 화면으로 돌아가 다른 사람의 문제를 풀어보세요.");
                return;
            }
            
            const q = myQuestions[currentQuestionIndex];
            ws.send(JSON.stringify({
                type: 'start_question',
                question_text: q.question,
                answer: q.answer,
                explanation: q.explanation
            }));
            
            currentQuestionIndex++;
        }

        function showAnswer() {
            let correctUsers = [];
            const ans = currentQuestionData.answer ? currentQuestionData.answer.toUpperCase() : '';
            
            if (ans !== 'O' && ans !== 'X') {
                const checkboxes = document.querySelectorAll('.correct-checkbox:checked');
                checkboxes.forEach(cb => correctUsers.push(cb.value));
            }
            
            ws.send(JSON.stringify({ type: 'show_answer', correct_users: correctUsers }));
        }

        function prevQuestion() {
            if (currentQuestionIndex > 1) {
                currentQuestionIndex -= 2; 
                startQuestion();
            } else {
                alert("첫 번째 문제입니다!");
            }
        }
    </script>
</body>
</html>
